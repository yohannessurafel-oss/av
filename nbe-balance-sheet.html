<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AVMF — NBE Balance Sheet Report</title>
<link rel="stylesheet" href="style2.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.report-container {
  padding: 16px;
  background: #fff;
  border-radius: 8px;
  margin: 16px;
  border: 1px solid var(--border-light, #c5daf0);
}
.report-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 12px;
  flex-wrap: wrap;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
}
.filter-group select, .filter-group input {
  padding: 6px 10px;
  border: 1px solid var(--border-light, #c5daf0);
  border-radius: 4px;
  font-size: 12px;
}
.btn-action {
  padding: 6px 14px;
  background: var(--navy-600, #2560a0);
  color: #fff;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 12px;
}
.btn-action:hover { background: var(--navy-700, #1b5199); }
.nbe-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  font-family: monospace, monospace;
}
.nbe-table th, .nbe-table td {
  padding: 6px 8px;
  border: 1px solid #d0d7de;
  text-align: right;
}
.nbe-table th {
  background: var(--navy-50, #eef4fb);
  color: var(--text-dark, #0d2a4a);
  font-weight: 700;
  text-transform: uppercase;
}
.nbe-table td.text-left { text-align: left; }
.nbe-table td.text-center { text-align: center; }
.nbe-table tr.row-category { background: #f6f8fa; font-weight: 700; }
.nbe-table tr.row-total { background: #e6f0fa; font-weight: 700; border-top: 2px solid #0d2a4a; }
.nbe-table tr.row-grand-total { background: #0d2a4a; color: #fff; font-weight: 700; }
.nbe-table tr.row-grand-total td { border-color: #0d2a4a; }
.loader-cell { text-align: center; padding: 20px; font-weight: 600; color: #555; }
</style>
</head>
<body>

<div class="window-container">
  <div class="title-bar">
    <div class="title-branding-block">
      <svg class="header-logo-svg" viewBox="0 0 100 100">
        <path d="M25,35 C30,20 45,15 65,18 C75,20 85,28 88,38 C90,45 80,55 83,62 C85,68 92,72 90,78 C88,84 80,82 76,88 C72,94 65,88 60,82 C55,80 50,92 42,90 C30,88 35,75 28,70 C20,65 12,62 10,52 C8,42 15,38 25,35 Z" fill="#e69c24"/>
        <path d="M25,35 C30,20 45,15 65,18 C75,20 85,28 88,38 C90,45 80,55 83,62 C74,60 62,54 55,42 C50,48 44,52 38,58 Z" fill="#1b5199"/>
      </svg>
      <div class="title-text-block">
        <span class="title-main">Africa Village Microfinance S.C.</span>
        <span class="title-sub">NBE Regulatory Balance Sheet Report</span>
      </div>
    </div>
    <div class="window-controls">
      <span title="Close" class="wc-close" onclick="window.location='nbe-reports.html'">✕</span>
    </div>
  </div>

  <div class="workspace">
    <div class="main-content">
      <div class="report-container">
        <div class="report-toolbar">
          <div class="filter-group">
            <label>As of Month:</label>
            <input type="month" id="reportPeriod" value="2026-08"/>
            <label>Branch:</label>
            <select id="branchFilter">
              <option value="ALL">All Branches</option>
              <option value="MAIN">Main Branch</option>
              <option value="EJERE">Ejere Branch</option>
              <option value="KALITY">Kality Branch</option>
            </select>
          </div>
          <button class="btn-action" onclick="generateBalanceSheet()">Generate Live Report</button>
        </div>

        <div style="text-align: center; margin-bottom: 12px;">
          <h3 style="margin:0; text-transform:uppercase;">Africa Village Microfinance S.C.</h3>
          <h4 style="margin:2px 0;" id="branchTitle">All Branches</h4>
          <h5 style="margin:2px 0; font-weight: normal;">Balance Sheet Report</h5>
          <span style="font-size: 11px; font-weight: bold;" id="periodTitle">Loading period...</span>
        </div>

        <table class="nbe-table">
          <thead>
            <tr>
              <th class="text-left" style="width: 35%;">Name</th>
              <th class="text-center" style="width: 5%;">Side</th>
              <th class="text-center" style="width: 10%;">Acc No</th>
              <th style="width: 12.5%;">Beg. Balance</th>
              <th style="width: 12.5%;">Period Debits</th>
              <th style="width: 12.5%;">Period Credits</th>
              <th style="width: 12.5%;">Ending Balance</th>
            </tr>
          </thead>
          <tbody id="balanceSheetBody">
            <tr><td colspan="7" class="loader-cell">Fetching database records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
// 1. Initialize Supabase Client
const SUPABASE_URL      = 'https://oxzthrubidohuwwhxsrk.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94enRocnViaWRvaHV3d2h4c3JrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MzExMTIsImV4cCI6MjA5MTIwNzExMn0.6NrwYlDDVzYZNouknbdPGtvNb_0GLkT12T370fyPRyA';

let supabaseClient = null;
if (window.supabase) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

function fmt(num) {
  if (num === null || num === undefined || isNaN(num)) return '0.00';
  if (num < 0) return `(${Math.abs(num).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})})`;
  return num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
}

async function generateBalanceSheet() {
  const tbody = document.getElementById('balanceSheetBody');
  tbody.innerHTML = '<tr><td colspan="7" class="loader-cell">Querying database journal entries...</td></tr>';

  const periodVal = document.getElementById('reportPeriod').value;
  const branchVal = document.getElementById('branchFilter').value;
  
  if (!periodVal) return;

  const [year, month] = periodVal.split('-');
  const startDate = `${year}-${month}-01`;
  const lastDay = new Date(year, month, 0).getDate();
  const endDate = `${year}-${month}-${lastDay}`;

  const monthName = new Date(year, month - 1).toLocaleString('en-US', { month: 'long' });
  document.getElementById('periodTitle').textContent = `As of the month ${monthName} of the year ${year}`;
  document.getElementById('branchTitle').textContent = branchVal === 'ALL' ? 'All Branches' : `${branchVal} Branch`;

  try {
    if (!supabaseClient) {
      throw new Error("Supabase SDK missing or environment keys not set in SUPABASE_URL / SUPABASE_ANON_KEY.");
    }

    // 1. Query Chart of Accounts (Matching DB schema: gl_account_code, account_name_title)
    const { data: accounts, error: accErr } = await supabaseClient
      .from('chart_of_accounts')
      .select('gl_account_code, account_name_title, account_type, current_balance')
      .in('account_type', ['ASSET', 'LIABILITY', 'EQUITY'])
      .order('gl_account_code', { ascending: true });

    if (accErr) throw accErr;

    // 2. Query Prior Journal Entries for Beginning Balances
    const { data: begTxns, error: begErr } = await supabaseClient
      .from('gl_transaction_journal')
      .select('gl_account_code, debit_amount, credit_amount')
      .lt('value_date', startDate);

    if (begErr) throw begErr;

    // 3. Query Period Journal Entries
    const { data: periodTxns, error: perErr } = await supabaseClient
      .from('gl_transaction_journal')
      .select('gl_account_code, debit_amount, credit_amount')
      .gte('value_date', startDate)
      .lte('value_date', endDate);

    if (perErr) throw perErr;

    // 4. Map & Aggregate Balances
    const accMap = {};
    accounts.forEach(acc => {
      accMap[acc.gl_account_code] = {
        name: acc.account_name_title,
        code: acc.gl_account_code,
        side: acc.account_type === 'ASSET' ? 'D' : 'C',
        type: acc.account_type,
        beg: 0,
        debits: 0,
        credits: 0,
        end: 0
      };
    });

    (begTxns || []).forEach(t => {
      if (accMap[t.gl_account_code]) {
        const side = accMap[t.gl_account_code].side;
        const net = Number(t.debit_amount || 0) - Number(t.credit_amount || 0);
        accMap[t.gl_account_code].beg += (side === 'D' ? net : -net);
      }
    });

    (periodTxns || []).forEach(t => {
      if (accMap[t.gl_account_code]) {
        accMap[t.gl_account_code].debits += Number(t.debit_amount || 0);
        accMap[t.gl_account_code].credits += Number(t.credit_amount || 0);
      }
    });

    let totalLiabilityAndCapitalEnd = 0;

    Object.values(accMap).forEach(acc => {
      if (acc.side === 'D') {
        acc.end = acc.beg + acc.debits - acc.credits;
      } else {
        acc.end = acc.beg + acc.credits - acc.debits;
      }

      if (acc.type === 'LIABILITY' || acc.type === 'EQUITY') {
        totalLiabilityAndCapitalEnd += acc.end;
      }
    });

    const rows = Object.values(accMap);
    if (rows.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center">No GL account balances found in database.</td></tr>';
      return;
    }

    let html = rows.map(acc => `
      <tr>
        <td class="text-left">${acc.name}</td>
        <td class="text-center">${acc.side}</td>
        <td class="text-center">${acc.code}</td>
        <td>${fmt(acc.beg)}</td>
        <td>${fmt(acc.debits)}</td>
        <td>${fmt(acc.credits)}</td>
        <td>${fmt(acc.end)}</td>
      </tr>
    `).join('');

    html += `
      <tr class="row-grand-total">
        <td class="text-left" colspan="6">LIABILITY & CAPITAL TOTAL</td>
        <td>${fmt(totalLiabilityAndCapitalEnd)}</td>
      </tr>
    `;

    tbody.innerHTML = html;

  } catch (err) {
    console.error('Balance Sheet Query Error:', err);
    tbody.innerHTML = `<tr><td colspan="7" class="text-center" style="color:#d9534f; font-weight:bold;">${err.message}</td></tr>`;
  }
}

// Trigger query on DOM load
window.addEventListener('DOMContentLoaded', generateBalanceSheet);
</script>
</body>
</html>
