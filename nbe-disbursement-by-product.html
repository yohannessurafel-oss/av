<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AVMF — Loan Disbursement By Product</title>
<link rel="stylesheet" href="style2.css"/>
<style>
.filter-bar {
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light, #c5daf0);
}
.filter-group { display: flex; align-items: center; gap: 8px; }
.filter-group label { font-size: 12px; font-weight: 700; color: var(--navy-800, #0d3460); }
.filter-group select,
.filter-group input { min-width: 140px; }
.filter-spacer { flex: 1; }
.btn-export {
  padding: 8px 16px;
  background: var(--navy-700, #1a4d80);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}
.btn-export:hover { background: var(--navy-800, #0d3460); }
.btn-run {
  padding: 8px 16px;
  background: var(--navy-600, #2560a0);
  color: #fff;
  border: none;
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
}
.btn-run:hover { background: var(--navy-800, #0d3460); }
.product-total-row td {
  font-weight: 800;
  color: #b91c1c;
  background: #f8fafc;
  border-top: 2px solid var(--navy-800, #0d3460) !important;
}
</style>
</head>
<body>

<div class="window-container">
  <div class="title-bar">
    <div class="title-branding-block">
      <svg class="header-logo-svg" viewBox="0 0 100 100">
        <path d="M25,35 C30,20 45,15 65,18 C75,20 85,28 88,38 C90,45 80,55 83,62 C85,68 92,72 90,78 C88,84 80,82 76,88 C72,94 65,88 60,82 C55,80 50,92 42,90 C30,88 35,75 28,70 C20,65 12,62 10,52 C8,42 15,38 25,35 Z" fill="#e69c24"/>
        <path d="M25,35 C30,20 45,15 65,18 C75,20 85,28 88,38 C90,45 80,55 83,62 C74,60 62,54 55,42 C50,48 44,52 38,58 Z" fill="#1b5199"/>
        <polygon points="45,45 45,35 50,35 50,45" fill="#ffffff"/>
        <polygon points="53,45 53,32 58,32 58,45" fill="#ffffff"/>
        <polygon points="61,45 61,30 66,30 66,45" fill="#ffffff"/>
        <polyline points="35,42 45,48 68,36" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      </svg>
      <div class="title-text-block">
        <span class="title-main">Africa Village Microfinance</span>
        <span class="title-sub">NBE Reports — Loan Disbursement By Product</span>
      </div>
    </div>
    <div class="window-controls">
      <span title="Close" class="wc-close" onclick="window.location='nbe-reports.html'">✕</span>
    </div>
  </div>

  <div class="workspace">
    <div class="sidebar">
      <div class="sidebar-header" style="cursor:pointer; background: var(--navy-900);" onclick="window.location='nbe-reports.html'">
        ← Back to NBE Reports
      </div>
    </div>

    <div class="main-content">
      <div class="module-view active">
        <div class="context-badge-bar">
          <span class="badge-icon">📦</span>
          Loan Disbursement By Product — total amount disbursed grouped by lending product
        </div>

        <div class="filter-bar">
          <div class="filter-group">
            <label>Branch</label>
            <select id="fBranch"><option value="all">All Branches</option></select>
          </div>
          <div class="filter-group">
            <label>Type</label>
            <select id="fType">
              <option value="monthly">Monthly</option>
              <option value="annual">Annual</option>
              <option value="custom">Custom Range</option>
            </select>
          </div>
          <div class="filter-group" id="monthGroup">
            <label>Month</label>
            <select id="fMonth"></select>
          </div>
          <div class="filter-group" id="yearGroup">
            <label>Year</label>
            <input type="number" id="fYear" min="2000" max="2100" style="width:90px;">
          </div>
          <div class="filter-group" id="customGroup" style="display:none;">
            <label>From</label>
            <input type="date" id="fFrom">
            <label>To</label>
            <input type="date" id="fTo">
          </div>
          <div class="filter-spacer"></div>
          <button class="btn-run" id="btnRun">Run</button>
          <button class="btn-export" id="btnExport">Export ⬇</button>
        </div>

        <div style="padding:12px 16px;">
          <table class="ledger-grid" style="width:100%;">
            <thead>
              <tr>
                <th>Item</th>
                <th>Code</th>
                <th class="text-right">Total Disbursed Amount (ETB)</th>
              </tr>
            </thead>
            <tbody id="tbodyProduct">
              <tr><td colspan="3" class="text-center gray-text italic">Set filters and click Run.</td></tr>
            </tbody>
          </table>
        </div>

        <div class="sub-footer-token" id="statusBar">Status: Ready</div>
      </div>
    </div>
  </div>
</div>

<script src="nbe-disbursement-by-product.js"></script>
</body>
</html>
