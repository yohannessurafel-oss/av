<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AVMF — Trial Balance</title>
<link rel="stylesheet" href="style2.css"/>
</head>
<body>

<div class="window-container">
  <div class="title-bar">
    <div class="title-branding-block">
      <svg class="header-logo-svg" viewBox="0 0 100 100">
        <path d="M25,35 C30,20 45,15 65,18 C75,20 85,28 88,38 C90,45 80,55 83,62 C85,68 92,72 90,78 C88,84 80,82 76,88 C72,94 65,88 60,82 C55,80 50,92 42,90 C30,88 35,75 28,70 C20,65 12,62 10,52 C8,42 15,38 25,35 Z" fill="#e69c24"/>
        <path d="M25,35 C30,20 45,15 65,18 C75,20 85,28 88,38 C90,45 80,55 83,62 C74,60 62,54 55,42 C50,48 44,52 38,58 Z" fill="#1b5199"/>
        <polygon points="45,45 45,35 50,35 50,45" fill="#ffffff"/>
        <polygon points="53,45 53,32 58,32 58,45" fill="#ffffff"/>
        <polygon points="61,45 61,30 66,30 66,45" fill="#ffffff"/>
        <polyline points="35,42 45,48 68,36" fill="none" stroke="#ffffff" stroke-width="2.5"/>
      </svg>
      <div class="title-text-block">
        <span class="title-main">Africa Village Microfinance</span>
        <span class="title-sub">NBE Reports — Trial Balance</span>
      </div>
    </div>
    <div class="window-controls">
      <span title="Close" class="wc-close" onclick="window.location='nbe-reports.html'">✕</span>
    </div>
  </div>

  <div class="workspace">
    <div class="sidebar">
      <div class="sidebar-header" style="cursor:pointer; background: var(--navy-900);" onclick="window.location='nbe-reports.html'">
        ← Back to NBE Reports
      </div>
    </div>

    <div class="main-content">
      <div class="module-view active">
        <div class="context-badge-bar">
          <span class="badge-icon">🏦</span>
          Trial Balance — computed live from gl_transaction_journal, as of today
        </div>

        <div style="padding:12px 16px;">
          <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
            <label style="font-size:12px; font-weight:600;">As of:</label>
            <input type="date" id="asOfDate" style="padding:6px; border:1px solid #cbd5e1; border-radius:4px;">
            <button id="btnRun" style="padding:7px 16px; background:#1b5199; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Run</button>
          </div>

          <table class="ledger-grid" style="width:100%;">
            <thead>
              <tr>
                <th>GL Account Code</th><th>Account Name</th><th>Type</th>
                <th class="text-right">Debit (ETB)</th><th class="text-right">Credit (ETB)</th>
              </tr>
            </thead>
            <tbody id="tbodyTB">
              <tr><td colspan="5" class="text-center gray-text italic">Click Run to generate.</td></tr>
            </tbody>
            <tfoot>
              <tr style="font-weight:700; background:#f5f5f5;">
                <td colspan="3" style="padding:6px 8px;">TOTALS</td>
                <td class="text-right" id="tbTotalDebit" style="padding:6px 8px;">—</td>
                <td class="text-right" id="tbTotalCredit" style="padding:6px 8px;">—</td>
              </tr>
            </tfoot>
          </table>

          <div id="balanceCheck" style="margin-top:10px; padding:10px; border-radius:6px; font-size:13px; font-weight:600; display:none;"></div>
        </div>

        <div class="sub-footer-token" id="statusBar">Status: Ready</div>
      </div>
    </div>
  </div>
</div>

<script src="nbe-trial-balance.js"></script>
</body>
</html>
